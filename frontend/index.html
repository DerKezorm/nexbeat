<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Das Zeichen trägt eine Fassung (?v=2): ein neues Zeichen darf nicht aus einem alten Eintrag im Browser kommen. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <!-- Als App installierbar: Manifest und Symbole (frontend/scripts/app-icons.py), ebenfalls mit Fassung. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="nexbeat" />
    <meta name="application-name" content="nexbeat" />
    <title>nexbeat</title>
    <!-- Vor dem ersten Zeichnen: sonst blitzt bei "hell" kurz die dunkle Seite auf. -->
    <script>
      try {
        if (localStorage.getItem('nexbeat.theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').content = '#f5f5f8';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

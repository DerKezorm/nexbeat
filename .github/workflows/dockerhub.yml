# Copies a release from ghcr.io to Docker Hub, for those who search there (Synology, QNAP, Docker Desktop).
# ghcr.io stays the source: nothing is built here, and if Docker Hub fails, the release still stands.
# Runs on its own after every release, or by hand for a version that is already on ghcr.io.
name: Docker Hub

on:
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version already on ghcr.io, like 1.4.1"
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: dockerhub
  cancel-in-progress: false

jobs:
  copy:
    name: Copy to Docker Hub
    runs-on: ubuntu-latest
    # After the build only for a green release tag, never for main or a pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    env:
      SOURCE: ghcr.io/derkezorm/nexbeat
      TARGET: docker.io/derkezorm/nexbeat
    steps:
      - name: Work out the version
        id: version
        env:
          FROM_INPUT: ${{ inputs.version }}
          FROM_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="${FROM_INPUT:-${FROM_TAG#v}}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Not a version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: v${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: derkezorm
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same tags as on ghcr.io: 1.2.3, 1.2 and latest. A pre-release (1.2.3-rc1) only gets its own.
      - name: Copy the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAGS=("$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            TAGS+=("${VERSION%.*}" latest)
          fi
          for tag in "${TAGS[@]}"; do
            docker buildx imagetools create --tag "$TARGET:$tag" "$SOURCE:$VERSION"
          done
          docker buildx imagetools inspect "$TARGET:$VERSION"

      # Docker Hub takes at most 25,000 bytes of README: a longer one ends at a heading, with a link to the rest.
      - name: Prepare the page
        shell: python
        run: |
          import os, pathlib, re
          text = pathlib.Path("README.md").read_text(encoding="utf-8")
          if len(text.encode()) > 24000:
              cuts = [m.start() for m in re.finditer(r"^## ", text, re.M) if len(text[:m.start()].encode()) <= 23500]
              text = text[:cuts[-1] if cuts else text.rfind("\n\n", 0, 23500)].rstrip()
              text += f"\n\n---\n\nThe full README is on GitHub: https://github.com/{os.environ['GITHUB_REPOSITORY']}#readme\n"
          pathlib.Path("dockerhub-readme.md").write_text(text, encoding="utf-8")

      - name: Update the page
        uses: peter-evans/dockerhub-description@v5
        with:
          username: derkezorm
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: derkezorm/nexbeat
          short-description: "Find music and request it from Lidarr or nexcrate. Accounts, single sign-on, quotas, API tokens."
          readme-filepath: dockerhub-readme.md
          enable-url-completion: true
